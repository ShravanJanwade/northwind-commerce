name: Deploy

# main → verify → staging → three production regions in parallel → verify.
# Each region is an Azure Storage static website in its own Azure region.
# Until deploy/azure-setup.sh has set the AZURE_* variables the deploy jobs
# are skipped, not failed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect sign-in to Azure; no stored credentials

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  integration-tests:
    name: Integration tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  deploy-staging:
    name: Deploy staging
    needs: integration-tests
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ steps.publish.outputs.url }}
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Staging runs the US storefront.
      - id: publish
        uses: ./.github/actions/publish-storefront
        with:
          region: us
          environment: staging
          storage-account: ${{ vars.STORAGE_STAGING }}

  deploy-us:
    name: Deploy production-us
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-us
      url: ${{ steps.publish.outputs.url }}
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: publish
        uses: ./.github/actions/publish-storefront
        with:
          region: us
          environment: production-us
          storage-account: ${{ vars.STORAGE_US }}

  deploy-ca:
    name: Deploy production-ca
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-ca
      url: ${{ steps.publish.outputs.url }}
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: publish
        uses: ./.github/actions/publish-storefront
        with:
          region: ca
          environment: production-ca
          storage-account: ${{ vars.STORAGE_CA }}

  deploy-eu:
    name: Deploy production-eu
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-eu
      url: ${{ steps.publish.outputs.url }}
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: publish
        uses: ./.github/actions/publish-storefront
        with:
          region: eu
          environment: production-eu
          storage-account: ${{ vars.STORAGE_EU }}

  verify-production:
    name: Verify production
    needs: [deploy-us, deploy-ca, deploy-eu]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Every region serves this release
        env:
          US: ${{ needs.deploy-us.outputs.url }}
          CA: ${{ needs.deploy-ca.outputs.url }}
          EU: ${{ needs.deploy-eu.outputs.url }}
        run: |
          for url in "$US" "$CA" "$EU"; do
            npm run smoke -- "$url" "$GITHUB_SHA"
          done
